<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduShareBF 🇧🇫</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: auto;
      padding: 20px;
    }

    .logo {
      text-align: center;
      margin: 30px 0;
    }

    .logo h1 {
      color: #1769e0;
      margin-bottom: 8px;
    }

    .logo p {
      color: #667085;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      margin-bottom: 22px;
    }

    .tab {
      flex: 1;
      padding: 14px;
      border: 0;
      background: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      color: #1769e0;
      border-bottom: 3px solid #1769e0;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    #message.show {
      display: block;
    }

    #message.success {
      background: #e8f7ee;
      color: #137333;
    }

    #message.error {
      background: #fdecec;
      color: #b42318;
    }

    #appScreen {
      display: none;
    }

    .logout {
      background: #dc3545;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>EduShareBF 🇧🇫</h1>
    <p>Apprendre • Partager • Réussir</p>
  </div>


  <!-- CONNEXION / INSCRIPTION -->

  <div id="authScreen" class="card">

    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        type="button">
        Connexion
      </button>

      <button
        id="signupTab"
        class="tab"
        type="button">
        Inscription
      </button>

    </div>


    <!-- CONNEXION -->

    <form id="loginForm" class="form active">

      <label for="loginEmail">
        Email
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Votre email"
        required
      >


      <label for="loginPassword">
        Mot de passe
      </label>

      <input
        id="loginPassword"
        type="password"
        placeholder="Votre mot de passe"
        required
      >


      <button
        id="loginButton"
        class="btn"
        type="submit">
        Se connecter
      </button>

    </form>


    <!-- INSCRIPTION -->

    <form id="signupForm" class="form">

      <label for="signupName">
        Nom complet
      </label>

      <input
        id="signupName"
        type="text"
        placeholder="Votre nom complet"
        required
      >


      <label for="signupEmail">
        Email
      </label>

      <input
        id="signupEmail"
        type="email"
        placeholder="Votre email"
        required
      >


      <label for="signupPassword">
        Mot de passe
      </label>

      <input
        id="signupPassword"
        type="password"
        placeholder="Minimum 6 caractères"
        minlength="6"
        required
      >


      <button
        id="signupButton"
        class="btn"
        type="submit">
        Créer mon compte
      </button>

    </form>


    <div id="message"></div>

  </div>


  <!-- APPLICATION APRÈS CONNEXION -->

  <div id="appScreen" class="card">

    <h2>Bienvenue 👋</h2>

    <p id="welcomeText"></p>

    <button
      id="logoutButton"
      class="btn logout"
      type="button">
      Se déconnecter
    </button>

  </div>

</div>
