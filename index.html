<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EduShareBF 🇧🇫</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      max-width: 430px;
      margin: auto;
      padding: 25px 18px;
    }

    .logo {
      text-align: center;
      margin: 30px 0 25px;
    }

    .logo h1 {
      color: #1769e0;
      margin-bottom: 8px;
    }

    .logo p {
      color: #667085;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 13px;
      border: none;
      background: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      color: #1769e0;
      border-bottom: 3px solid #1769e0;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .message.show {
      display: block;
    }

    .success {
      background: #e8f7ee;
      color: #137333;
    }

    .error {
      background: #fdecec;
      color: #b42318;
    }

    #signupForm,
    #appScreen {
      display: none;
    }

    .logout {
      background: #dc3545;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>EduShareBF 🇧🇫</h1>
    <p>Apprendre • Partager • Réussir</p>
  </div>

  <!-- CONNEXION / INSCRIPTION -->
  <div id="authScreen" class="card">

    <div class="tabs">

      <button id="loginTab" class="tab active" type="button">
        Connexion
      </button>

      <button id="signupTab" class="tab" type="button">
        Inscription
      </button>

    </div>


    <!-- CONNEXION -->

    <form id="loginForm">

      <label>Email</label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Votre adresse email"
        required
      >

      <label>Mot de passe</label>

      <input
        id="loginPassword"
        type="password"
        placeholder="Votre mot de passe"
        required
      >

      <button class="btn" type="submit">
        Se connecter
      </button>

    </form>


    <!-- INSCRIPTION -->

    <form id="signupForm">

      <label>Nom complet</label>

      <input
        id="signupName"
        type="text"
        placeholder="Votre nom complet"
        required
      >

      <label>Email</label>

      <input
        id="signupEmail"
        type="email"
        placeholder="Votre adresse email"
        required
      >

      <label>Mot de passe</label>

      <input
        id="signupPassword"
        type="password"
        placeholder="Minimum 6 caractères"
        minlength="6"
        required
      >

      <button class="btn" type="submit">
        Créer mon compte
      </button>

    </form>


    <div id="message" class="message"></div>

  </div>


  <!-- ÉCRAN APRÈS CONNEXION -->

  <div id="appScreen" class="card">

    <h2>Bienvenue 👋</h2>

    <p id="welcomeText"></p>

    <button id="logoutButton" class="btn logout">
      Se déconnecter
    </button>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://0ec90b57d6e95fcbda19832f.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_-1PQweXtzFo2awLV-0NBrQ_9CXGwvPc";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ÉLÉMENTS */

const loginTab =
document.getElementById("loginTab");

const signupTab =
document.getElementById("signupTab");

const loginForm =
document.getElementById("loginForm");

const signupForm =
document.getElementById("signupForm");

const authScreen =
document.getElementById("authScreen");

const appScreen =
document.getElementById("appScreen");

const message =
document.getElementById("message");


/* MESSAGE */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
  "message show " + type;

}


/* CONNEXION */

loginTab.addEventListener("click", function() {

  loginForm.style.display = "block";

  signupForm.style.display = "none";

  loginTab.classList.add("active");

  signupTab.classList.remove("active");

  message.className = "message";

});


/* INSCRIPTION */

signupTab.addEventListener("click", function() {

  loginForm.style.display = "none";

  signupForm.style.display = "block";

  signupTab.classList.remove("active");

  signupTab.classList.add("active");

  loginTab.classList.remove("active");

  message.className = "message";

});


/* CRÉER UN COMPTE */

signupForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const name =
  document.getElementById("signupName").value.trim();

  const email =
  document.getElementById("signupEmail").value.trim();

  const password =
  document.getElementById("signupPassword").value;


  const { data, error } =
  await supabaseClient.auth.signUp({

    email: email,

    password: password,

    options: {

      data: {
        full_name: name
      }

    }

  });


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  if (!data.session) {

    showMessage(
      "Compte créé ! Vérifie ton email pour confirmer ton compte.",
      "success"
    );

  } else {

    showApp(data.user);

  }

});


/* SE CONNECTER */

loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
  document.getElementById("loginEmail").value.trim();

  const password =
  document.getElementById("loginPassword").value;


  const { data, error } =
  await supabaseClient.auth.signInWithPassword({

    email: email,

    password: password

  });


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  showApp(data.user);

});


/* AFFICHER L'APPLICATION */

function showApp(user) {

  authScreen.style.display = "none";

  appScreen.style.display = "block";


  const name =
  user.user_metadata?.full_name ||
  user.email?.split("@")[0] ||
  "Utilisateur";


  document.getElementById("welcomeText").textContent =
  "Bonjour " + name + " ! Ton compte EduShareBF est connecté.";
}


/* DÉCONNEXION */

document
.getElementById("logoutButton")
.addEventListener("click", async function() {

  await supabaseClient.auth.signOut();

  appScreen.style.display = "none";

  authScreen.style.display = "block";

});


/* VÉRIFIER LA SESSION */

async function checkSession() {

  const { data } =
  await supabaseClient.auth.getSession();

  if (data.session) {

    showApp(data.session.user);

  }

}

checkSession();

</script>

</body>
</html>
